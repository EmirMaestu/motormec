name: Deploy

# Deploy por TAG: se dispara al pushear un tag `vX.Y.Z`, o manualmente desde
# Actions (workflow_dispatch). Deploya el ÚLTIMO commit de `main` (el tag es el
# disparador; taggeá el HEAD de main). Es un no-op hasta configurar los secrets
# del VPS (Settings → Secrets and variables → Actions): VPS_HOST, VPS_USER,
# VPS_SSH_KEY, y opcional VPS_PORT.
#
# El VPS necesita: (1) la clave pública en ~/.ssh/authorized_keys del VPS_USER,
# (2) sudo sin contraseña para ese usuario (deploy no interactivo).
#
# Lanzar una versión:
#   git tag v1.4.0 && git push origin v1.4.0
# (o "Run workflow" en la pestaña Actions).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
    steps:
      - name: Release info
        run: echo "Deploying ${GITHUB_REF_NAME} (${GITHUB_SHA})"

      - name: Check deploy config
        id: cfg
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "VPS secrets not set — skipping deploy (this is expected until configured)."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # Corre EXACTAMENTE el flujo manual que ya funciona en el VPS: pull como
      # motormec, npm ci en la RAÍZ (workspaces), build api+web, migrar, publicar
      # y reiniciar. sudo sin password lo permite el sudoers del VPS_USER.
      - name: Deploy on VPS
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/id_deploy -p "${VPS_PORT:-22}" -o StrictHostKeyChecking=accept-new \
            "$VPS_USER@$VPS_HOST" bash -lc '
            set -e
            cd /opt/motormec
            sudo -H -u motormec git checkout -- package-lock.json 2>/dev/null || true
            sudo -H -u motormec git fetch --prune --tags origin
            sudo -H -u motormec git pull --ff-only origin main
            sudo -H -u motormec npm ci
            sudo -H -u motormec npm run build --workspace @motormec/api
            sudo -H -u motormec npm run db:migrate --workspace @motormec/api
            sudo -H -u motormec npm run build --workspace @motormec/web
            sudo cp -r apps/web/dist/* /var/www/motormec/app/
            sudo cp -r landing/* /var/www/motormec/landing/
            sudo systemctl restart motormec-api
            sleep 2
            curl -fsS http://127.0.0.1:3002/api/health && echo " — Deploy OK"
          '
