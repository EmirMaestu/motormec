# Momec — nginx vhost para coexistir con un proyecto ya instalado.
#
# Sirve TODO bajo un subdominio propio (ej. app.tudominio.com), así no toca
# el server_name del proyecto existente.
#
# Instalación:
#   1) Reemplazá  __DOMAIN__  por tu subdominio (ej. app.tudominio.com).
#   2) Si la API no está en 3001, cambiá  127.0.0.1:3001  por el puerto real.
#   3) sudo cp infra/nginx/momec.conf /etc/nginx/sites-available/momec.conf
#      sudo ln -s /etc/nginx/sites-available/momec.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   4) TLS (Let's Encrypt), no rompe otros sitios:
#      sudo certbot --nginx -d __DOMAIN__
#      (certbot agrega el bloque 443 y el redirect 80→443 automáticamente)

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Subida de fotos desde el dashboard.
    client_max_body_size 15m;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- API + webhook de WhatsApp → Fastify ---
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /webhooks/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- SPA del taller (build con base '/app/') ---
    location /app/ {
        alias /var/www/motormec/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # --- Landing (marketing) en la raíz del subdominio ---
    location / {
        root /var/www/motormec/landing;
        try_files $uri $uri/ /index.html;
    }
}
